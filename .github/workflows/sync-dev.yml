name: Capture Dev Schema Changes

on:
  workflow_dispatch: # Allows manual run button in GitHub UI
  push:
    branches:
      - development
    paths:
      - 'supabase/migrations/**'

jobs:
  capture-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push committed migration files back to the repository

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Dev Project
        run: supabase link --project-ref ${{ secrets.DEV_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Generate Schema Dump
        run: |
          mkdir -p supabase/migrations
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          supabase db dump --linked -f supabase/migrations/${TIMESTAMP}_dev_sync.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Commit and Push to Development Branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync schema changes from Dev Supabase"
          branch: development